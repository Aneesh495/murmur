name: verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Guile / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Guile on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y guile-3.0
      - name: Install Guile on macOS
        if: runner.os == 'macOS'
        run: brew install guile
      - name: Verify source, algorithms, and whole commands
        run: make verify
      - name: Preserve raw check results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-${{ matrix.os }}
          path: build/*.json
          if-no-files-found: warn
          retention-days: 14
